<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio | Tienda Libre</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e6f2ff;
      margin: 0;
      padding: 20px;
      color: #2c3e50;
    }

    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero {
      background-color: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      color: #1a5276;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.08);
    }

    .hero p {
      margin: 0 0 20px;
      line-height: 1.7;
      color: #3b4a59;
    }

    .nav-links {
      display: inline-flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .nav-links a {
      display: inline-block;
      padding: 11px 18px;
      background-color: #1a5276;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }



  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="hero">
      <h1>Bienvenido a Tienda Libre</h1>
      <p>Esta es la página principal de la app. Explora productos, conoce más sobre el desarrollador y vuelve siempre que quieras.</p>
      <div class="nav-links">
        <a href="{% url 'tiendalibre:home' %}">Inicio</a>
        <a href="{% url 'tiendalibre:acerca_de_mi' %}">Acerca de mí</a>
        <a href="/admin/">Admin</a>
      </div>
    </div>
</body>
</html>
